<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Bazinha Prime</title>
<meta name="description" content="CRM de corretoras — organize seus contatos e feche mais vendas.">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bazinha Prime">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* ==========================================================================
   Bazinha Prime — Identidade visual
   Azul #2563EB · Violeta #7C3AED · Branco predominante
   Mobile-first, cantos arredondados, sombras leves, transições suaves.
   ========================================================================== */

:root {
    --azul: #2563EB;
    --azul-600: #1D4ED8;
    --azul-050: #EFF4FF;
    --violeta: #7C3AED;
    --violeta-050: #F3EEFF;
    --grad: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
    --grad-soft: linear-gradient(135deg, #60A5FA 0%, #A78BFA 100%);

    --bg: #F5F6FB;
    --surface: #FFFFFF;
    --surface-2: #FBFBFE;
    --line: #ECEDF4;
    --ink: #171A2B;
    --ink-2: #5A607A;
    --ink-3: #969CB4;

    --ok: #22C55E;
    --warn: #F59E0B;
    --danger: #EF4444;

    --r-lg: 22px;
    --r-md: 16px;
    --r-sm: 12px;
    --sh-1: 0 2px 10px rgba(23, 26, 43, .05);
    --sh-2: 0 8px 24px rgba(37, 60, 130, .10);
    --sh-3: 0 16px 40px rgba(37, 60, 130, .18);

    --tab-h: 68px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --font-ui: 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
}
body { max-width: 560px; margin-inline: auto; position: relative; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: var(--font-ui); }
.is-hidden { display: none !important; }

/* ------------------------------- Welcome -------------------------------- */
.welcome {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; padding: 32px 22px;
}
.welcome__bg {
    position: absolute; inset: 0; background: var(--grad); z-index: 0;
}
.welcome__bg::before, .welcome__bg::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(2px); opacity: .35;
}
.welcome__bg::before {
    width: 320px; height: 320px; background: #fff; top: -120px; right: -90px;
    animation: float1 9s ease-in-out infinite;
}
.welcome__bg::after {
    width: 240px; height: 240px; background: #C4B5FD; bottom: -80px; left: -70px;
    animation: float2 11s ease-in-out infinite;
}
@keyframes float1 { 50% { transform: translateY(24px) scale(1.05); } }
@keyframes float2 { 50% { transform: translateY(-22px) scale(1.08); } }

.welcome__inner {
    position: relative; z-index: 1; width: 100%;
    color: #fff; text-align: center;
    animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }

.brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 30px; }
.brand__mark {
    width: 60px; height: 60px; border-radius: 18px; background: rgba(255,255,255,.16);
    display: grid; place-items: center; backdrop-filter: blur(6px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
}
.brand__name { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
.brand__name span { font-weight: 500; opacity: .85; }

.welcome__hello { margin-bottom: 26px; }
.welcome__eyebrow { font-size: 13px; font-weight: 600; opacity: .9; margin: 0 0 8px; }
.welcome__msg { font-size: 21px; font-weight: 700; line-height: 1.3; margin: 0 0 8px; }
.welcome__sub { font-size: 14px; opacity: .9; margin: 0; }

.welcome__pick { font-size: 13px; font-weight: 600; opacity: .85; margin: 0 0 14px; text-transform: uppercase; letter-spacing: .06em; }

.broker-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.broker-card {
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
    border-radius: var(--r-md); padding: 18px 14px; color: #fff; text-align: center;
    backdrop-filter: blur(8px); transition: transform .18s, background .2s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.broker-card:active { transform: scale(.96); background: rgba(255,255,255,.24); }
.broker-card__avatar { font-size: 30px; width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,.2); display: grid; place-items: center; overflow: hidden; }
.broker-card__avatar img { width: 100%; height: 100%; object-fit: cover; }
.broker-card__name { font-size: 15px; font-weight: 700; }
.broker-card__go { font-size: 12px; opacity: .85; font-weight: 600; }
.welcome__foot { margin-top: 24px; font-size: 12px; opacity: .8; }

/* -------------------------------- App shell ----------------------------- */
.app { min-height: 100vh; padding-bottom: calc(var(--tab-h) + var(--safe-b) + 14px); animation: fadeIn .35s ease both; }
@keyframes fadeIn { from { opacity: 0; } }

.topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px calc(14px);
    background: var(--grad); color: #fff;
    border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
    box-shadow: var(--sh-2);
}
.topbar__profile, .topbar__switch {
    width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
    background: rgba(255,255,255,.16); color: #fff; flex: none;
}
.topbar__switch:active, .topbar__profile:active { background: rgba(255,255,255,.3); }
.topbar__avatar { font-size: 22px; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; overflow: hidden; }
.topbar__avatar img { width: 100%; height: 100%; object-fit: cover; }
.topbar__title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.1; }
.topbar__hello { font-size: 12px; opacity: .85; }
.topbar__name { font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.reminder-strip {
    margin: 12px 16px 0; padding: 12px 14px; border-radius: var(--r-md);
    background: linear-gradient(135deg, #FFF7ED, #FEF3C7);
    border: 1px solid #FDE68A; color: #92400E; font-size: 13.5px; font-weight: 600;
    display: flex; align-items: center; gap: 10px; box-shadow: var(--sh-1);
    animation: rise .4s ease both;
}
.reminder-strip b { color: #B45309; }
.reminder-strip .rs-ico { font-size: 18px; }

.view { padding: 16px; animation: viewIn .32s cubic-bezier(.2,.8,.2,1) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }

.section-title { font-size: 13px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin: 22px 4px 12px; }
.section-title:first-child { margin-top: 4px; }

/* ------------------------------ Bottom nav ------------------------------ */
.tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 560px; height: calc(var(--tab-h) + var(--safe-b));
    padding-bottom: var(--safe-b);
    background: rgba(255,255,255,.9); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    display: flex; z-index: 40;
}
.tabbar__btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; color: var(--ink-3); transition: color .18s; position: relative;
}
.tabbar__ico { font-size: 21px; transition: transform .2s; filter: grayscale(.4); opacity: .7; }
.tabbar__lbl { font-size: 10.5px; font-weight: 700; }
.tabbar__btn.is-active { color: var(--azul); }
.tabbar__btn.is-active .tabbar__ico { transform: translateY(-2px) scale(1.12); filter: none; opacity: 1; }
.tabbar__btn.is-active::before {
    content: ""; position: absolute; top: 8px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--azul);
}

.fab {
    position: fixed; right: max(18px, calc(50% - 280px + 18px)); bottom: calc(var(--tab-h) + var(--safe-b) + 16px);
    width: 58px; height: 58px; border-radius: 20px; background: var(--grad); color: #fff;
    display: grid; place-items: center; box-shadow: var(--sh-3); z-index: 41;
    transition: transform .18s;
}
.fab:active { transform: scale(.9); }

/* -------------------------------- Cards --------------------------------- */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat {
    background: var(--surface); border-radius: var(--r-md); padding: 15px 15px 14px;
    box-shadow: var(--sh-1); border: 1px solid var(--line); position: relative; overflow: hidden;
    transition: transform .16s;
}
.stat:active { transform: scale(.97); }
.stat__ico { font-size: 20px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 10px; }
.stat__num { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.stat__lbl { font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-top: 4px; }
.stat--wide { grid-column: 1 / -1; }

.hero-card {
    background: var(--grad); color: #fff; border-radius: var(--r-lg);
    padding: 20px; box-shadow: var(--sh-2); position: relative; overflow: hidden;
}
.hero-card::after {
    content: ""; position: absolute; width: 160px; height: 160px; border-radius: 50%;
    background: rgba(255,255,255,.12); top: -60px; right: -40px;
}
.hero-card__row { display: flex; gap: 18px; position: relative; z-index: 1; }
.hero-card__item { flex: 1; }
.hero-card__num { font-size: 30px; font-weight: 800; line-height: 1; }
.hero-card__lbl { font-size: 12px; opacity: .9; font-weight: 600; margin-top: 4px; }
.hero-card__title { font-size: 13px; font-weight: 700; opacity: .9; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }

/* Client card */
.client {
    background: var(--surface); border-radius: var(--r-md); padding: 14px;
    box-shadow: var(--sh-1); border: 1px solid var(--line); margin-bottom: 11px;
    display: flex; gap: 12px; align-items: flex-start; transition: transform .14s, box-shadow .18s;
    animation: rise .3s ease both;
}
.client:active { transform: scale(.985); box-shadow: var(--sh-2); }
.client__avatar {
    width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center;
    font-weight: 800; font-size: 16px; color: #fff; background: var(--grad-soft);
}
.client__main { flex: 1; min-width: 0; }
.client__top { display: flex; align-items: center; gap: 7px; }
.client__name { font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.client__badges { display: flex; gap: 4px; margin-left: auto; flex: none; }
.badge-vip { font-size: 10px; font-weight: 800; color: #92400E; background: #FEF3C7; border: 1px solid #FCD34D; padding: 2px 6px; border-radius: 999px; }
.badge-star { color: #F59E0B; font-size: 14px; }
.client__meta { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.client__meta span { display: inline-flex; align-items: center; gap: 4px; }
.client__foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.pill {
    font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px;
}
.pill__dot { width: 7px; height: 7px; border-radius: 50%; }
.client__wa {
    margin-left: auto; background: #25D366; color: #fff; width: 40px; height: 40px;
    border-radius: 13px; display: grid; place-items: center; flex: none; box-shadow: 0 4px 12px rgba(37,211,102,.35);
    transition: transform .15s;
}
.client__wa:active { transform: scale(.88); }
.due-tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.due-today { background: #DBEAFE; color: #1D4ED8; }
.due-late { background: #FEE2E2; color: #B91C1C; }

/* Search + filters */
.searchbar {
    display: flex; align-items: center; gap: 9px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; box-shadow: var(--sh-1);
    margin-bottom: 12px;
}
.searchbar input { border: none; outline: none; flex: 1; font-size: 15px; background: transparent; color: var(--ink); }
.searchbar svg { color: var(--ink-3); flex: none; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
    flex: none; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap;
    transition: all .18s;
}
.chip.is-active { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip .chip__n { opacity: .6; margin-left: 3px; font-size: 11px; }

/* Funnel */
.funnel-stage { margin-bottom: 14px; }
.funnel-stage__head {
    display: flex; align-items: center; gap: 10px; padding: 0 2px 9px;
}
.funnel-stage__bar { width: 4px; height: 22px; border-radius: 4px; }
.funnel-stage__label { font-weight: 800; font-size: 14.5px; }
.funnel-stage__count { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--ink-3); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.funnel-empty { font-size: 13px; color: var(--ink-3); padding: 10px 2px 4px; }

/* Empty state */
.empty { text-align: center; padding: 46px 24px; color: var(--ink-3); }
.empty__emoji { font-size: 46px; margin-bottom: 10px; }
.empty__title { font-size: 16px; font-weight: 800; color: var(--ink-2); margin-bottom: 6px; }
.empty__text { font-size: 13.5px; line-height: 1.5; }

/* Menu list (Mais) */
.menu-list { display: flex; flex-direction: column; gap: 10px; }
.menu-item {
    display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 15px; box-shadow: var(--sh-1); transition: transform .14s; width: 100%; text-align: left;
}
.menu-item:active { transform: scale(.98); }
.menu-item__ico { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; flex: none; }
.menu-item__txt { flex: 1; }
.menu-item__title { font-size: 15px; font-weight: 700; }
.menu-item__sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.menu-item__arrow { color: var(--ink-3); }

/* Achievements */
.achv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.achv__card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 18px 14px; text-align: center; box-shadow: var(--sh-1); position: relative;
}
.achv__card.locked { opacity: .55; filter: grayscale(.6); }
.achv__emoji { font-size: 38px; }
.achv__title { font-size: 14px; font-weight: 800; margin-top: 8px; }
.achv__meta { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.achv__badge { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 800; color: var(--ok); }

/* Progress bar */
.progress { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress__fill { height: 100%; background: var(--grad); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }

/* ------------------------------ Overlays -------------------------------- */
.scrim {
    position: fixed; inset: 0; background: rgba(15,18,35,.5); z-index: 60;
    opacity: 0; transition: opacity .25s; backdrop-filter: blur(2px);
}
.scrim.show { opacity: 1; }

.sheet {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%);
    width: 100%; max-width: 560px; background: var(--surface);
    border-top-left-radius: 26px; border-top-right-radius: 26px;
    z-index: 61; padding: 10px 18px calc(24px + var(--safe-b));
    box-shadow: 0 -10px 40px rgba(0,0,0,.2); transition: transform .32s cubic-bezier(.2,.9,.2,1);
    max-height: 92vh; overflow-y: auto;
}
.sheet.show { transform: translate(-50%, 0); }
.sheet__grip { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 16px; }
.sheet__title { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
.sheet__sub { font-size: 13.5px; color: var(--ink-2); margin-bottom: 18px; }

.outcome-list { display: flex; flex-direction: column; gap: 10px; }
.outcome {
    display: flex; align-items: center; gap: 13px; padding: 14px 15px; border-radius: 15px;
    border: 1.5px solid var(--line); background: var(--surface-2); font-size: 15px; font-weight: 700;
    transition: all .15s; width: 100%; text-align: left;
}
.outcome:active { transform: scale(.98); }
.outcome__ico { font-size: 21px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.outcome__arrow { margin-left: auto; color: var(--ink-3); }

/* Detail sheet */
.detail__head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.detail__avatar { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: #fff; background: var(--grad-soft); flex: none; }
.detail__name { font-size: 20px; font-weight: 800; line-height: 1.15; }
.detail__loc { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.detail__actions { display: grid; grid-template-columns: repeat(4,1fr); gap: 9px; margin-bottom: 18px; }
.act-btn {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 4px;
    border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line);
    font-size: 11px; font-weight: 700; color: var(--ink-2); transition: transform .14s;
}
.act-btn:active { transform: scale(.93); }
.act-btn__ico { font-size: 20px; }
.act-btn.wa { background: #E9FBEF; border-color: #BBF7D0; color: #15803D; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
.info { background: var(--surface-2); border: 1px solid var(--line); border-radius: 13px; padding: 11px 13px; }
.info__k { font-size: 11px; color: var(--ink-3); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.info__v { font-size: 14px; font-weight: 600; margin-top: 3px; word-break: break-word; }
.info--wide { grid-column: 1 / -1; }

.timeline { position: relative; padding-left: 20px; margin-top: 6px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
.tl-item { position: relative; padding: 0 0 14px; }
.tl-item::before { content: ""; position: absolute; left: -18px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--azul); box-shadow: 0 0 0 3px var(--azul-050); }
.tl-item__txt { font-size: 13.5px; font-weight: 600; }
.tl-item__date { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

/* Forms */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.field input, .field select, .field textarea {
    width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 13px;
    font-size: 15px; background: var(--surface-2); color: var(--ink); transition: border .15s, background .15s;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--azul); background: #fff; }
.field textarea { resize: vertical; min-height: 80px; }
.field-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn {
    width: 100%; padding: 15px; border-radius: 15px; font-size: 15.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .14s, opacity .2s;
}
.btn:active { transform: scale(.98); }
.btn--primary { background: var(--grad); color: #fff; box-shadow: var(--sh-2); }
.btn--ghost { background: var(--surface-2); color: var(--ink-2); border: 1.5px solid var(--line); }
.btn--danger { background: #FEF2F2; color: var(--danger); border: 1.5px solid #FECACA; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }
.btn-row .btn { margin: 0; }

.seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 13px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.seg button.is-active { background: #fff; color: var(--azul); box-shadow: var(--sh-1); }

/* Toast */
#toast-root { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + var(--safe-b) + 20px); z-index: 90; display: flex; flex-direction: column; gap: 8px; width: max-content; max-width: 90%; }
.toast {
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 13.5px; font-weight: 600;
    box-shadow: var(--sh-3); display: flex; align-items: center; gap: 9px; animation: toastIn .3s ease both;
}

.skl { background: linear-gradient(90deg,#eef0f6 25%,#f7f8fc 50%,#eef0f6 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 12px; }

<script>
/* ==========================================================================
   Bazinha Prime — App single-file (100% no navegador)
   Persistência local por corretora (localStorage). Dados nunca se misturam.
   ========================================================================== */
(function () {
    "use strict";

    const FUNIL = {
        novo_lead:        { label: "Novos Leads",      emoji: "📥", cor: "#3B82F6" },
        primeiro_contato: { label: "Primeiro Contato", emoji: "📞", cor: "#06B6D4" },
        em_atendimento:   { label: "Em Atendimento",   emoji: "💬", cor: "#7C3AED" },
        visita_agendada:  { label: "Visita Agendada",  emoji: "🏡", cor: "#F59E0B" },
        negociacao:       { label: "Negociação",       emoji: "🤝", cor: "#F97316" },
        venda_concluida:  { label: "Venda Concluída",  emoji: "✅", cor: "#22C55E" },
        nao_interessado:  { label: "Não Interessado",  emoji: "❌", cor: "#EF4444" },
    };
    const ORDEM = Object.keys(FUNIL);
    const CONQUISTAS = [
        { id: "primeira_venda", meta: 1,   titulo: "Primeira Venda", emoji: "🌟" },
        { id: "dez_vendas",     meta: 10,  titulo: "10 Vendas",      emoji: "🔥" },
        { id: "cinquenta",      meta: 50,  titulo: "50 Vendas",      emoji: "💎" },
        { id: "cem_vendas",     meta: 100, titulo: "100 Vendas",     emoji: "👑" },
    ];
    const FRASES = [
        "Hoje pode ser o dia da sua próxima grande venda.",
        "Cada contato é uma porta que pode se abrir. Vá em frente!",
        "Organização hoje, comissão amanhã. Bora! 🚀",
        "A venda começa com uma boa conversa. Comece a sua.",
        "Foco no cliente certo, no momento certo. Você consegue!",
    ];
    // PINs de fábrica (bloqueio local desde o 1º acesso; cada corretora pode trocar depois)
    const DEFAULT_PINS = { 1: "4517", 2: "2839", 3: "7162", 4: "9043" };
    const interesseLabel = (v) => v === "sim" ? "Tem interesse" : v === "nao" ? "Sem interesse" : "A avaliar";

    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    const HOJE = () => new Date().toISOString().slice(0, 10);
    const pad = (n) => String(n).padStart(2, "0");
    const AGORA = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const normWa = (t) => { const d = (t || "").replace(/\D/g, ""); return !d ? "" : (d.startsWith("55") ? d : "55" + d); };

    /* ------------------------------ Persistência --------------------------- */
    function expand(s) {
        return {
            id: s.i, nome: s.n, telefone: s.t, whatsapp: s.w, email: s.e,
            cidade: "Santo André", bairro: s.b, endereco: s.a,
            tipo_imovel: "", faixa_preco: "", forma_pagamento: "", observacoes: "",
            origem_lead: "Lista Santo André", data_cadastro: HOJE(),
            ultimo_contato: null, proximo_retorno: null, status: "novo_lead",
            vip: false, favorito: false, interesse: null,
            historico: s.t ? [{ data: AGORA(), tipo: "cadastro", texto: "Lead importado da lista de Santo André" }] : [{ data: AGORA(), tipo: "cadastro", texto: "Lead importado da lista de Santo André" }, { data: AGORA(), tipo: "nota", texto: "⚠️ O telefone não constava (ou era inválido) na lista. Adicione o número correto antes de contatar." }],
        };
    }
    function defaultCfg(n) {
        return { nome: "Corretora " + n, foto: "", telefone: "", imobiliaria: "",
            mensagem_padrao: "Olá! Tudo bem? Aqui é da imobiliária, vi seu interesse e queria te ajudar a encontrar o imóvel ideal. 🏡",
            tema: "claro", meta_diaria: 10, vendas_total: 0 };
    }
    const DB = {
        kC: (n) => `bzp:${n}:clientes`, kCfg: (n) => `bzp:${n}:config`, kBk: (n) => `bzp:${n}:backups`,
        getClientes(n) { try { const r = localStorage.getItem(this.kC(n)); if (r) return JSON.parse(r); } catch (e) {} return this.seed(n); },
        seed(n) { const arr = (SEED[n] || []).map(expand); this.saveClientes(n, arr); return arr; },
        saveClientes(n, a) { try { localStorage.setItem(this.kC(n), JSON.stringify(a)); } catch (e) { toast("Armazenamento cheio. Faça e baixe um backup."); } },
        getConfig(n) { try { const r = localStorage.getItem(this.kCfg(n)); if (r) return JSON.parse(r); } catch (e) {} const c = defaultCfg(n); this.saveConfig(n, c); return c; },
        saveConfig(n, c) { try { localStorage.setItem(this.kCfg(n), JSON.stringify(c)); } catch (e) {} },
        getBackups(n) { try { return JSON.parse(localStorage.getItem(this.kBk(n)) || "[]"); } catch (e) { return []; } },
        saveBackups(n, b) { try { localStorage.setItem(this.kBk(n), JSON.stringify(b)); } catch (e) {} },
        kPin: (n) => `bzp:${n}:pin`,
        getPin(n) { try { return localStorage.getItem(this.kPin(n)) || null; } catch (e) { return null; } },
        setPin(n, h) { try { if (h) localStorage.setItem(this.kPin(n), h); else localStorage.removeItem(this.kPin(n)); } catch (e) {} },
    };

    /* ------------------------------ Estatísticas --------------------------- */
    function computeStats(clientes) {
        const cont = {}; ORDEM.forEach(k => cont[k] = 0);
        const t = HOJE();
        let retornos_hoje = 0, atrasados = 0, vip = 0, favoritos = 0, sem_resposta = 0, aguardando = 0;
        let interessados = 0, sem_interesse = 0, a_avaliar = 0;
        clientes.forEach(c => {
            const st = c.status || "novo_lead";
            if (cont[st] != null) cont[st]++;
            if (c.vip) vip++;
            if (c.favorito) favoritos++;
            if (c.interesse === "sim") interessados++; else if (c.interesse === "nao") sem_interesse++; else a_avaliar++;
            if (c.proximo_retorno) {
                if (c.proximo_retorno === t) retornos_hoje++;
                else if (c.proximo_retorno < t && !["venda_concluida", "nao_interessado"].includes(st)) atrasados++;
                aguardando++;
            }
            if (st === "primeiro_contato" && !c.ultimo_contato) sem_resposta++;
        });
        const total = clientes.length, vendas = cont.venda_concluida || 0;
        const contatados = total - (cont.novo_lead || 0);
        const conversao = contatados > 0 ? Math.round((vendas / contatados) * 1000) / 10 : 0;
        return { total, por_status: cont, retornos_hoje, atrasados, vip, favoritos, sem_resposta,
            aguardando_retorno: aguardando, visitas: cont.visita_agendada || 0, negociacoes: cont.negociacao || 0, vendas, conversao,
            interessados, sem_interesse, a_avaliar };
    }

    /* ---------------------------- "API" local ------------------------------ */
    async function api(action, { body = null } = {}) {
        const n = state.corretora;
        const load = () => DB.getClientes(n);
        const save = (a) => DB.saveClientes(n, a);
        const find = (a, id) => a.find(c => c.id === id);
        switch (action) {
            case "bootstrap": { const clientes = load(); return { ok: true, config: DB.getConfig(n), clientes, stats: computeStats(clientes) }; }
            case "criar_cliente": {
                const a = load(); const nome = (body.nome || "").trim();
                if (!nome) return { ok: false, erro: "Informe o nome." };
                let max = 0; a.forEach(c => { const m = /(\d+)/.exec(c.id || ""); if (m) max = Math.max(max, +m[1]); });
                const cli = { id: "c_" + String(max + 1).padStart(4, "0"), nome,
                    telefone: (body.telefone || "").replace(/\D/g, ""), whatsapp: normWa(body.telefone || ""),
                    email: (body.email || "").trim(), cidade: (body.cidade || "").trim(), bairro: (body.bairro || "").trim(),
                    endereco: (body.endereco || "").trim(), tipo_imovel: (body.tipo_imovel || "").trim(),
                    faixa_preco: (body.faixa_preco || "").trim(), forma_pagamento: (body.forma_pagamento || "").trim(),
                    observacoes: (body.observacoes || "").trim(), origem_lead: (body.origem_lead || "Cadastro manual").trim(),
                    data_cadastro: HOJE(), ultimo_contato: null, proximo_retorno: body.proximo_retorno || null,
                    status: ORDEM.includes(body.status) ? body.status : "novo_lead", vip: !!body.vip, favorito: !!body.favorito, interesse: body.interesse || null,
                    historico: [{ data: AGORA(), tipo: "cadastro", texto: "Cliente cadastrado" }] };
                a.push(cli); save(a); return { ok: true, cliente: cli };
            }
            case "atualizar_cliente": {
                const a = load(); const c = find(a, body.id); if (!c) return { ok: false, erro: "Não encontrado." };
                ["nome", "email", "cidade", "bairro", "endereco", "tipo_imovel", "faixa_preco", "forma_pagamento", "observacoes", "origem_lead", "proximo_retorno"]
                    .forEach(k => { if (k in body) c[k] = typeof body[k] === "string" ? body[k].trim() : body[k]; });
                if ("telefone" in body) { c.telefone = (body.telefone || "").replace(/\D/g, ""); c.whatsapp = normWa(body.telefone || ""); }
                save(a); return { ok: true, cliente: c };
            }
            case "excluir_cliente": { let a = load(); const antes = a.length; a = a.filter(c => c.id !== body.id); save(a); return { ok: a.length < antes }; }
            case "mudar_status": {
                const a = load(); const c = find(a, body.id); if (!c) return { ok: false, erro: "Não encontrado." };
                if (!ORDEM.includes(body.status)) return { ok: false, erro: "Status inválido." };
                c.status = body.status;
                c.historico.push({ data: AGORA(), tipo: "status", texto: 'Status alterado para "' + FUNIL[body.status].label + '"' + (body.obs ? " — " + body.obs : "") });
                if (body.proximo_retorno) c.proximo_retorno = body.proximo_retorno;
                if (body.status === "venda_concluida") { const cfg = DB.getConfig(n); cfg.vendas_total = (cfg.vendas_total || 0) + 1; DB.saveConfig(n, cfg); }
                save(a); return { ok: true, cliente: c };
            }
            case "registrar_contato": {
                const a = load(); const c = find(a, body.id); if (!c) return { ok: false, erro: "Não encontrado." };
                c.ultimo_contato = HOJE(); c.historico.push({ data: AGORA(), tipo: "contato", texto: "Contato realizado via WhatsApp" });
                if (c.status === "novo_lead") c.status = "primeiro_contato";
                save(a); return { ok: true, cliente: c };
            }
            case "add_nota": {
                const a = load(); const c = find(a, body.id); if (!c) return { ok: false, erro: "Não encontrado." };
                if (body.texto) c.historico.push({ data: AGORA(), tipo: "nota", texto: body.texto });
                if ("observacoes" in body) c.observacoes = (body.observacoes || "").trim();
                save(a); return { ok: true, cliente: c };
            }
            case "set_lembrete": {
                const a = load(); const c = find(a, body.id); if (!c) return { ok: false, erro: "Não encontrado." };
                c.proximo_retorno = body.data || null;
                c.historico.push({ data: AGORA(), tipo: "lembrete", texto: body.data ? ("Retorno agendado para " + body.data.split("-").reverse().join("/")) : "Lembrete removido" });
                save(a); return { ok: true, cliente: c };
            }
            case "toggle_favorito": { const a = load(); const c = find(a, body.id); if (!c) return { ok: false }; c.favorito = !c.favorito; save(a); return { ok: true, cliente: c }; }
            case "toggle_vip": { const a = load(); const c = find(a, body.id); if (!c) return { ok: false }; c.vip = !c.vip; save(a); return { ok: true, cliente: c }; }
            case "set_interesse": {
                const a = load(); const c = find(a, body.id); if (!c) return { ok: false };
                c.interesse = body.valor || null;
                const txt = body.valor === "sim" ? "Marcado como INTERESSADO ✅" : body.valor === "nao" ? "Marcado como SEM interesse ❌" : "Interesse não avaliado";
                c.historico.push({ data: AGORA(), tipo: "interesse", texto: txt });
                save(a); return { ok: true, cliente: c };
            }
            case "salvar_config": {
                const cfg = DB.getConfig(n);
                ["nome", "foto", "telefone", "mensagem_padrao", "tema", "imobiliaria"].forEach(k => { if (k in body) cfg[k] = typeof body[k] === "string" ? body[k].trim() : body[k]; });
                if ("meta_diaria" in body) cfg.meta_diaria = Math.max(1, parseInt(body.meta_diaria) || 10);
                DB.saveConfig(n, cfg); return { ok: true, config: cfg };
            }
            case "backup": {
                const bks = DB.getBackups(n); const dados = load();
                bks.unshift({ arquivo: "backup_" + AGORA().replace(/[^0-9]/g, ""), data: new Date().toLocaleString("pt-BR"), tamanho: JSON.stringify(dados).length, dados });
                DB.saveBackups(n, bks.slice(0, 8)); return { ok: true };
            }
            case "listar_backups": { return { ok: true, backups: DB.getBackups(n).map(b => ({ arquivo: b.arquivo, data: b.data, tamanho: b.tamanho })) }; }
            case "restaurar_backup": {
                const bks = DB.getBackups(n); const b = bks.find(x => x.arquivo === body.arquivo);
                if (!b) return { ok: false };
                // snapshot de segurança antes
                bks.unshift({ arquivo: "auto_" + AGORA().replace(/[^0-9]/g, ""), data: new Date().toLocaleString("pt-BR"), tamanho: JSON.stringify(load()).length, dados: load() });
                DB.saveBackups(n, bks.slice(0, 8));
                save(b.dados); return { ok: true };
            }
        }
        return { ok: false, erro: "Ação desconhecida." };
    }

    let toastTimer;
    function toast(msg, tipo = "info", acao = null) {
        $("#toast-root").innerHTML = "";
        const t = document.createElement("div");
        t.className = `toast ${tipo}`;
        t.innerHTML = `<span>${esc(msg)}</span>` + (acao ? `<button class="toast__act">${esc(acao.label)}</button>` : "");
        $("#toast-root").appendChild(t);
        if (acao) t.querySelector(".toast__act").addEventListener("click", () => { clearTimeout(toastTimer); t.remove(); acao.fn(); });
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateY(10px)"; t.style.transition = "all .25s"; setTimeout(() => t.remove(), 260); }, acao ? 5000 : 2300);
    }

    /* ----------------------------- Sheet manager --------------------------- */
    const sheets = [];
    function openSheet(html, { onMount } = {}) {
        const scrim = document.createElement("div"); scrim.className = "scrim";
        const sheet = document.createElement("div"); sheet.className = "sheet";
        sheet.innerHTML = `<div class="sheet__grip"></div>${html}`;
        $("#overlay-root").appendChild(scrim); $("#overlay-root").appendChild(sheet);
        requestAnimationFrame(() => { scrim.classList.add("show"); sheet.classList.add("show"); });
        scrim.addEventListener("click", () => closeSheet());
        const entry = { scrim, sheet }; sheets.push(entry);
        if (onMount) onMount(sheet);
        return entry;
    }
    function closeSheet() { const e = sheets.pop(); if (!e) return; e.scrim.classList.remove("show"); e.sheet.classList.remove("show"); setTimeout(() => { e.scrim.remove(); e.sheet.remove(); }, 320); }
    function closeAllSheets() { while (sheets.length) closeSheet(); }

    /* ------------------------------ Utilitários ---------------------------- */
    const iniciais = (nome) => { const p = (nome || "?").trim().split(/\s+/); return ((p[0]?.[0] || "") + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };
    function corDeNome(nome) { let h = 0; for (const c of (nome || "")) h = (h * 31 + c.charCodeAt(0)) % 360; return `linear-gradient(135deg, hsl(${h} 70% 62%), hsl(${(h + 40) % 360} 70% 55%))`; }
    function statusPill(st) { const s = FUNIL[st] || FUNIL.novo_lead; return `<span class="pill" style="background:${s.cor}18;color:${s.cor}"><span class="pill__dot" style="background:${s.cor}"></span>${esc(s.label)}</span>`; }
    function whatsappLink(c) { const num = c.whatsapp || ("55" + (c.telefone || "").replace(/\D/g, "")); const msg = encodeURIComponent(state.config?.mensagem_padrao || ""); return `https://wa.me/${num}${msg ? "?text=" + msg : ""}`; }
    function fmtTel(t) { const d = (t || "").replace(/\D/g, ""); if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return t; }
    function dueTag(c) { if (!c.proximo_retorno) return ""; const t = HOJE(); if (c.proximo_retorno === t) return `<span class="due-tag due-today">Retornar hoje</span>`; if (c.proximo_retorno < t && !["venda_concluida", "nao_interessado"].includes(c.status)) return `<span class="due-tag due-late">Atrasado</span>`; return ""; }

    const FILTROS = [["todos", "Todos"], ["vip", "🔥 VIP"], ["favoritos", "⭐ Favoritos"], ["retornos_hoje", "Retornos hoje"], ["pendentes", "Pendentes"], ["em_atendimento", "Em atendimento"], ["visita_agendada", "Visitas"], ["negociacao", "Negociação"], ["venda_concluida", "Vendidos"], ["nao_interessado", "Não interessados"]];

    function filtrar() {
        const t = HOJE(); let arr = state.clientes.slice(); const f = state.filtro;
        if (f === "vip") arr = arr.filter(c => c.vip);
        else if (f === "favoritos") arr = arr.filter(c => c.favorito);
        else if (f === "retornos_hoje") arr = arr.filter(c => c.proximo_retorno === t);
        else if (f === "atrasados") arr = arr.filter(c => c.proximo_retorno && c.proximo_retorno < t && !["venda_concluida", "nao_interessado"].includes(c.status));
        else if (f === "pendentes") arr = arr.filter(c => ["novo_lead", "primeiro_contato", "em_atendimento"].includes(c.status));
        else if (ORDEM.includes(f)) arr = arr.filter(c => c.status === f);
        if (state.bairro) arr = arr.filter(c => c.bairro === state.bairro);
        const q = state.busca.trim().toLowerCase();
        if (q) arr = arr.filter(c => [c.nome, c.telefone, c.cidade, c.bairro, c.tipo_imovel, c.email].some(v => (v || "").toLowerCase().includes(q)));
        const o = state.ordenar;
        if (o === "nome") arr.sort((a, b) => a.nome.localeCompare(b.nome));
        else if (o === "recentes") arr.sort((a, b) => (b.data_cadastro || "").localeCompare(a.data_cadastro || ""));
        else if (o === "retorno") arr.sort((a, b) => (a.proximo_retorno || "9999").localeCompare(b.proximo_retorno || "9999"));

        return arr;

    /* =============================== MEU DIA ============================= */
    function viewMeuDia() {
        const t = HOJE();
        const retornos = state.clientes.filter(c => c.proximo_retorno === t);
        const atrasados = state.clientes.filter(c => c.proximo_retorno && c.proximo_retorno < t && !["venda_concluida", "nao_interessado"].includes(c.status));
        const visitas = state.clientes.filter(c => c.status === "visita_agendada");
        const negoc = state.clientes.filter(c => c.status === "negociacao");
        const vips = state.clientes.filter(c => c.vip && !["venda_concluida", "nao_interessado"].includes(c.status));
        const contatosHoje = state.clientes.filter(c => c.ultimo_contato === t).length;
        const meta = state.config.meta_diaria || 10, pct = Math.min(100, Math.round((contatosHoje / meta) * 100));
        const bloco = (titulo, arr, vazio) => `<div class="section-title">${titulo} <span style="color:var(--azul)">${arr.length}</span></div>${arr.length ? arr.map(clientCard).join("") : `<div class="funnel-empty">${vazio}</div>`}`;
        return `
        <div class="hero-card">
            <div class="hero-card__title">🎯 Meta do dia</div>
            <div style="font-size:14px;font-weight:700;margin-bottom:10px">${contatosHoje} de ${meta} contatos feitos hoje</div>
            <div class="progress" style="background:rgba(255,255,255,.25)"><div class="progress__fill" style="width:${pct}%;background:#fff"></div></div>
            <div style="font-size:12px;opacity:.9;margin-top:8px">${pct >= 100 ? "Meta batida! Você arrasou hoje. 🎉" : `Faltam ${Math.max(0, meta - contatosHoje)} para bater a meta.`}</div>
        </div>
        <button class="btn btn--primary" data-act="atender" style="margin:14px 0 4px">⚡ Atender pendentes agora</button>
        ${atrasados.length ? bloco("⚠️ Atrasados", atrasados, "") : ""}
        ${bloco("📅 Retornos para hoje", retornos, "Nenhum retorno agendado para hoje. Que tal agendar alguns?")}
        ${bloco("🏡 Visitas agendadas", visitas, "Nenhuma visita marcada ainda.")}
        ${bloco("🤝 Negociações abertas", negoc, "Nenhuma negociação em aberto.")}
        ${bloco("🔥 Clientes VIP", vips, "Marque seus melhores clientes como VIP.")}`;
    }

    /* =============================== AGENDA ============================= */
    function viewAgenda() {
        const comData = state.clientes.filter(c => c.proximo_retorno).sort((a, b) => a.proximo_retorno.localeCompare(b.proximo_retorno));
        if (!comData.length) return emptyState("📅", "Agenda vazia", "Agende retornos nos clientes para vê-los aqui organizados por data.");
        const t = HOJE(); const grupos = {};
        comData.forEach(c => { (grupos[c.proximo_retorno] = grupos[c.proximo_retorno] || []).push(c); });
        return Object.keys(grupos).sort().map(d => {
            const rot = new Date(d + "T00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
            let tag = ""; if (d === t) tag = ` <span class="due-tag due-today">Hoje</span>`; else if (d < t) tag = ` <span class="due-tag due-late">Atrasado</span>`;
            return `<div class="section-title" style="text-transform:capitalize">${rot}${tag}</div>${grupos[d].map(clientCard).join("")}`;
        }).join("");
    }

    function viewConquistas() {
        const v = state.config.vendas_total || 0; const prox = CONQUISTAS.find(c => v < c.meta);

            <div class="progress" style="background:rgba(255,255,255,.25)"><div class="progress__fill" style="width:${pct}%;background:#fff"></div></div></div>
        <div class="section-title">Marcos</div>
        <div class="achv">${CONQUISTAS.map(c => { const ok = v >= c.meta; return `<div class="achv__card ${ok ? "" : "locked"}">${ok ? `<div class="achv__badge">✓ Conquistado</div>` : ""}<div class="achv__emoji">${c.emoji}</div><div class="achv__title">${esc(c.titulo)}</div><div class="achv__meta">${ok ? "Desbloqueado!" : `${v}/${c.meta} vendas`}</div></div>`; }).join("")}</div>`;

    /* ========================== PRODUTIVIDADE ========================== */
    function viewProdutividade() {
        const s = state.stats; const contatos = state.clientes.filter(c => c.ultimo_contato).length;
        const maxFunil = Math.max(1, ...ORDEM.map(k => s.por_status[k] || 0));
        const linha = (k) => { const f = FUNIL[k], nq = s.por_status[k] || 0; return `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px"><span>${f.emoji} ${esc(f.label)}</span><span style="color:${f.cor}">${nq}</span></div><div class="progress"><div class="progress__fill" style="width:${Math.round((nq / maxFunil) * 100)}%;background:${f.cor}"></div></div></div>`; };
        const stat = (num, lbl, ico, bg) => `<div class="stat"><div class="stat__ico" style="background:${bg}">${ico}</div><div class="stat__num">${num}</div><div class="stat__lbl">${lbl}</div></div>`;
        return `<div class="section-title" style="margin-top:4px">Resumo</div>
        <div class="stat-grid">${stat(s.total, "Clientes", "📋", "#DBEAFE")}${stat(contatos, "Contatos feitos", "📞", "#CFFAFE")}${stat(s.visitas, "Visitas", "🏡", "#FEF3C7")}${stat(s.negociacoes, "Negociações", "🤝", "#FFEDD5")}${stat(s.vendas, "Vendas", "✅", "#DCFCE7")}${stat(s.conversao + "%", "Conversão", "📈", "#EDE9FE")}${stat(s.sem_resposta, "Sem resposta", "🔕", "#F3F4F6")}${stat(s.aguardando_retorno, "Aguardando", "⏳", "#FCE7F3")}</div>
        <div class="section-title">Distribuição no funil</div>
        <div class="stat" style="padding:16px">${ORDEM.map(linha).join("")}</div>`;
    }

    /* ===================== FLUXO WHATSAPP + DESFECHO ==================== */
    let filaAtendimento = [];
    async function fluxoWhatsapp(id, emFila = false) {
        const c = state.clientes.find(x => x.id === id); if (!c) return;
        window.open(whatsappLink(c), "_blank");
        api("registrar_contato", { body: { id } }).then(r => { if (r.ok) atualizarLocal(r.cliente); });
        abrirDesfecho(id, emFila);
    }
    const DESFECHOS = [["nao_respondeu", "🔕", "#F3F4F6", "Não respondeu", null], ["interesse", "😊", "#DBEAFE", "Demonstrou interesse", "em_atendimento"], ["visita", "🏡", "#FEF3C7", "Agendar visita", "visita_agendada"], ["negociacao", "🤝", "#FFEDD5", "Em negociação", "negociacao"], ["venda", "✅", "#DCFCE7", "Venda concluída", "venda_concluida"], ["nao_interessado", "❌", "#FEE2E2", "Não interessado", "nao_interessado"]];
    function abrirDesfecho(id, emFila) {
        openSheet(`<div class="sheet__title">Como terminou este atendimento?</div><div class="sheet__sub">Toque no resultado — o status atualiza sozinho.${emFila ? " Depois já vem o próximo." : ""}</div>
            <div class="outcome-list">${DESFECHOS.map(([key, ico, bg, label, st]) => `<button class="outcome" data-act="desfecho" data-id="${id}" data-key="${key}" data-status="${st || ""}" data-fila="${emFila ? 1 : 0}"><span class="outcome__ico" style="background:${bg}">${ico}</span>${label}<span class="outcome__arrow">›</span></button>`).join("")}</div>`);
    }
    async function aplicarDesfecho(id, key, status, emFila) {
        closeSheet();
        if (key === "nao_respondeu") { const r = await api("add_nota", { body: { id, texto: "Cliente não respondeu ao contato" } }); if (r.ok) atualizarLocal(r.cliente); toast("Anotado: não respondeu."); }
        else if (status) {
            const r = await api("mudar_status", { body: { id, status } }); if (r.ok) atualizarLocal(r.cliente);
            if (["em_atendimento", "visita_agendada", "negociacao", "venda_concluida"].includes(status)) await api("set_interesse", { body: { id, valor: "sim" } });
            else if (status === "nao_interessado") await api("set_interesse", { body: { id, valor: "nao" } });
            if (status === "venda_concluida") toast("Parabéns pela venda! 🎉", "ok"); else toast("Status atualizado.", "ok");
        }
        await recarregar();
        if (emFila && filaAtendimento.length) { setTimeout(() => proximoDaFila(), 350); }
        else { filaAtendimento = []; rerender(); }
    }
    function iniciarAtendimento() {
        const t = HOJE();
        filaAtendimento = state.clientes.filter(c => c.proximo_retorno === t || (c.proximo_retorno && c.proximo_retorno < t && !["venda_concluida", "nao_interessado"].includes(c.status)));
        if (!filaAtendimento.length) filaAtendimento = state.clientes.filter(c => c.status === "novo_lead");
        if (!filaAtendimento.length) { toast("Nenhum cliente pendente para atender. 🎉"); return; }
        proximoDaFila();
    }
    function proximoDaFila() {
        const prox = filaAtendimento.shift();
        if (!prox) { toast("Fila concluída! Ótimo trabalho. 🎉", "ok"); rerender(); return; }
        const c = state.clientes.find(x => x.id === prox.id) || prox;
        openSheet(`<div class="sheet__title">Próximo da fila</div><div class="sheet__sub">${filaAtendimento.length} restante(s) depois deste</div>
            <div class="client" style="cursor:default"><div class="client__avatar" style="background:${corDeNome(c.nome)}">${esc(iniciais(c.nome))}</div>
                <div class="client__main"><div class="client__top"><span class="client__name">${esc(c.nome)}</span></div>
                <div class="client__meta">${c.bairro ? `<span>📍 ${esc(c.bairro)}</span>` : ""}<span>📱 ${esc(fmtTel(c.telefone))}</span></div>
                <div class="client__foot">${statusPill(c.status)}${dueTag(c)}</div></div></div>
            <div class="btn-row" style="margin-top:8px"><button class="btn btn--ghost" data-act="pular-fila">Pular</button><button class="btn btn--primary" data-act="wa-fila" data-id="${c.id}">💬 Abrir WhatsApp</button></div>`);
    }

    function abrirMudarStatus(id) {
        const c = state.clientes.find(x => x.id === id);
        openSheet(`<div class="sheet__title">Mover no funil</div><div class="sheet__sub">${esc(c.nome)}</div><div class="outcome-list">${ORDEM.map(k => { const f = FUNIL[k]; return `<button class="outcome" data-act="set-status" data-id="${id}" data-status="${k}" ${c.status === k ? 'style="border-color:' + f.cor + ';background:' + f.cor + '10"' : ""}><span class="outcome__ico" style="background:${f.cor}20">${f.emoji}</span>${esc(f.label)}${c.status === k ? '<span class="outcome__arrow">✓</span>' : '<span class="outcome__arrow">›</span>'}</button>`; }).join("")}</div>`);

    }

    /* ===================== NOVO / EDITAR (sheet) ====================== */
    function abrirFormCliente(id) {

    /* ------------------------------- PIN -------------------------------- */
    function seedDefaultPins() {
        try {
            if (localStorage.getItem("bzp:pins_seeded") === "1") return;
            for (const n of [1, 2, 3, 4]) { if (!localStorage.getItem(DB.kPin(n))) localStorage.setItem(DB.kPin(n), hashPin(n, DEFAULT_PINS[n])); }
            localStorage.setItem("bzp:pins_seeded", "1");
        } catch (e) {}
    }
    function hashPin(n, pin) { const data = `bzp-salt-${n}:${pin}`; let h = 5381; for (let i = 0; i < data.length; i++) h = ((h * 33) ^ data.charCodeAt(i)) >>> 0; return "p" + h.toString(16); }
    const PINLOCK_HTML = `
        <button class="pinlock__back pin-back" data-act="pin-back">← Voltar</button>
        <div class="pin-title"></div><div class="pin-sub"></div>
        <div class="pin-dots">${'<span class="pin-dot"></span>'.repeat(4)}</div>
        <div class="pin-err"></div>
        <div class="pin-pad">
            ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(nn => `<button class="pin-key" data-act="pin-key" data-key="${nn}">${nn}</button>`).join("")}
            <button class="pin-key blank"></button>
            <button class="pin-key" data-act="pin-key" data-key="0">0</button>
            <button class="pin-key" data-act="pin-del">⌫</button>
        </div>`;
    function promptPin(cfg) {
        pinCfg = cfg; pinBuf = [];
        let el = $("#pinlock");
        if (!el) {
            el = document.createElement("div"); el.className = "pinlock"; el.id = "pinlock"; el.innerHTML = PINLOCK_HTML;
            $("#overlay-root").appendChild(el); requestAnimationFrame(() => el.classList.add("show"));
            pinKeyHandler = (e) => { if (e.key >= "0" && e.key <= "9") pinPush(e.key); else if (e.key === "Backspace") pinPop(); else if (e.key === "Escape") { if (pinCfg && pinCfg.onBack) pinCfg.onBack(); } };
            window.addEventListener("keydown", pinKeyHandler);
        }
        el.querySelector(".pin-title").textContent = cfg.title || "";
        el.querySelector(".pin-sub").textContent = cfg.subtitle || "";
        el.querySelector(".pin-back").style.display = cfg.showBack ? "" : "none";
        el.querySelectorAll(".pin-dot").forEach(d => d.classList.remove("on"));
        const err = el.querySelector(".pin-err"); if (err) err.textContent = "";
    }
    function closePinLock() { const el = $("#pinlock"); if (el) { el.classList.remove("show"); setTimeout(() => el.remove(), 250); } if (pinKeyHandler) { window.removeEventListener("keydown", pinKeyHandler); pinKeyHandler = null; } pinBuf = []; pinCfg = null; }
    function renderPinDots() { $$("#pinlock .pin-dot").forEach((d, i) => d.classList.toggle("on", i < pinBuf.length)); }
    function pinPush(d) { if (!$("#pinlock") || pinBuf.length >= 4) return; const err = $("#pinlock .pin-err"); if (err && pinBuf.length === 0) err.textContent = ""; pinBuf.push(d); renderPinDots(); if (pinBuf.length === 4) { const pin = pinBuf.join(""); const cb = pinCfg && pinCfg.onDone; setTimeout(() => { if (cb) cb(pin); }, 140); } }
    function pinPop() { if (pinBuf.length) { pinBuf.pop(); renderPinDots(); } }
    function pinError(msg) { const el = $("#pinlock"); if (!el) return; pinBuf = []; el.querySelectorAll(".pin-dot").forEach(d => d.classList.remove("on")); const box = el.querySelector(".pin-dots"); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); const err = el.querySelector(".pin-err"); if (err) err.textContent = msg; }
    function entrarComPin(n) {
        const h = DB.getPin(n);
        if (!h) { entrar(n); return; }
        pinAttempts = 0;
        promptPin({ title: DB.getConfig(n).nome || ("Corretora " + n), subtitle: "Digite seu PIN de acesso", showBack: true, onBack: closePinLock,
            onDone: (pin) => { if (hashPin(n, pin) === h) { closePinLock(); entrar(n); } else { pinAttempts++; pinError(pinAttempts >= 3 ? "PIN incorreto. Sem o código não dá para abrir esta área." : "PIN incorreto. Tente de novo."); } } });
    }
    function fluxoDefinirPin() {
        const step1 = () => promptPin({ title: DB.getPin(state.corretora) ? "Alterar PIN" : "Criar PIN", subtitle: "Escolha um código de 4 dígitos", showBack: true, onBack: closePinLock, onDone: (p1) => step2(p1) });
        const step2 = (p1) => promptPin({ title: "Confirme o PIN", subtitle: "Digite os 4 dígitos de novo", showBack: true, onBack: step1, onDone: (p2) => { if (p1 !== p2) { pinError("Os códigos não são iguais. Tente de novo."); return; } DB.setPin(state.corretora, hashPin(state.corretora, p1)); closePinLock(); toast("PIN salvo. Sua área está protegida. 🔒", "ok"); const ps = $("#pin-section"); if (ps) ps.innerHTML = pinSectionInner(); } });

            case "set-status": { closeSheet(); const r = await api("mudar_status", { body: { id, status: t.dataset.status } }); if (r.ok) { atualizarLocal(r.cliente); await recarregar(); rerender(); toast("Etapa atualizada.", "ok"); } break; }
            case "fav": { const r = await api("toggle_favorito", { body: { id } }); if (r.ok) { atualizarLocal(r.cliente); await recarregar(); closeSheet(); rerender(); toast(r.cliente.favorito ? "Adicionado aos favoritos ⭐" : "Removido dos favoritos"); } break; }
            case "vip": { const r = await api("toggle_vip", { body: { id } }); if (r.ok) { atualizarLocal(r.cliente); await recarregar(); closeSheet(); rerender(); toast(r.cliente.vip ? "Cliente VIP 🔥" : "VIP removido"); } break; }
            case "lembrete": abrirLembrete(id); break;
            case "quick-date": { const d = new Date(); d.setDate(d.getDate() + parseInt(t.dataset.days)); $("#lembrete-data").value = d.toISOString().slice(0, 10); $$(".seg [data-act='quick-date']").forEach(b => b.classList.remove("is-active")); t.classList.add("is-active"); break; }
            case "salvar-lembrete": { const data = $("#lembrete-data").value; const r = await api("set_lembrete", { body: { id, data } }); if (r.ok) { atualizarLocal(r.cliente); await recarregar(); closeSheet(); rerender(); toast("Retorno agendado. 📅", "ok"); } break; }
            case "remover-lembrete": { const r = await api("set_lembrete", { body: { id, data: "" } }); if (r.ok) { atualizarLocal(r.cliente); await recarregar(); closeSheet(); rerender(); toast("Lembrete removido."); } break; }
            case "salvar-obs": { const obs = $(`#obs-${id}`).value; const r = await api("add_nota", { body: { id, observacoes: obs, texto: "Observação atualizada" } }); if (r.ok) { atualizarLocal(r.cliente); toast("Observação salva.", "ok"); } break; }
            case "copiar": { navigator.clipboard?.writeText(t.dataset.tel).then(() => toast("Telefone copiado. 📋")).catch(() => toast("Não consegui copiar.")); break; }
            case "editar": closeSheet(); setTimeout(() => abrirFormCliente(id), 320); break;
            case "salvar-cliente": salvarCliente(id || null); break;
            case "excluir": confirmarExcluir(id); break;
            case "perfil": abrirPerfil(); break;
            case "pick-avatar": $("#p-foto").value = t.dataset.emoji; $$("[data-act='pick-avatar']").forEach(b => b.classList.remove("is-active")); t.classList.add("is-active"); break;
            case "tema": { const sheet = sheets[sheets.length - 1].sheet; sheet.dataset.tema = t.dataset.tema; $$("[data-act='tema']").forEach(b => b.classList.remove("is-active")); t.classList.add("is-active"); aplicarTema(t.dataset.tema); break; }
            case "salvar-perfil": salvarPerfil(); break;
            case "backup-agora": { const r = await api("backup", { body: {} }); if (r.ok) { toast("Backup criado! 💾", "ok"); rerender(); } break; }
            case "exportar": exportar(); break;
            case "importar": importar(); break;
            case "restaurar": confirmarRestaurar(t.dataset.arq); break;
            case "goto-int": state.interesseTab = t.dataset.tab; setView("interesse"); break;
            case "int-tab": state.interesseTab = t.dataset.tab; rerender(); break;
            case "pdf-lista": gerarPDF(t.dataset.tab); break;
            case "pdf-geral": gerarPDF("geral"); break;
            case "set-interesse": {
                const novo = t.classList.contains("on") ? "" : t.dataset.valor;
                const r = await api("set_interesse", { body: { id, valor: novo } });
                if (r.ok) {
                    atualizarLocal(r.cliente);
                    const seg = t.closest(".interesse-seg");
                    if (seg) { seg.querySelectorAll(".int-btn").forEach(b => b.classList.remove("on")); if (novo) t.classList.add("on"); }
                    await recarregar();
                    toast(novo === "sim" ? "Marcado como interessado ✅" : novo === "nao" ? "Marcado como sem interesse ❌" : "Classificação removida", "ok");
                }
                break;
            }
            case "instalar": instalarPWA(); break;
            case "criar-pin": case "alterar-pin": fluxoDefinirPin(); break;
            case "remover-pin": removerPin(); break;
            case "pin-key": pinPush(t.dataset.key); break;
            case "pin-del": pinPop(); break;
            case "pin-back": if (pinCfg && pinCfg.onBack) pinCfg.onBack(); else closePinLock(); break;
            case "sair": confirmarSair(); break;
        }
    });

    /* ---------------------------- Confirmações --------------------------- */
    function confirmar(titulo, texto, textoBtn, onSim, perigo = true) {
        openSheet(`<div class="sheet__title">${esc(titulo)}</div><div class="sheet__sub">${esc(texto)}</div><div class="btn-row"><button class="btn btn--ghost" data-act="cancelar-conf">Cancelar</button><button class="btn ${perigo ? "btn--danger" : "btn--primary"}" id="btn-confirmar">${esc(textoBtn)}</button></div>`,
            { onMount: (s) => { const y = s.querySelector("#btn-confirmar"); const c = s.querySelector("[data-act='cancelar-conf']"); if (y) y.addEventListener("click", () => onSim()); if (c) c.addEventListener("click", () => closeSheet()); } });
    }
    function confirmarExcluir(id) {
        const c = state.clientes.find(x => x.id === id);
        confirmar("Excluir cliente?", `"${c.nome}" e todo o histórico serão apagados.`, "Excluir", async () => {
            ultimoExcluido = JSON.parse(JSON.stringify(c));
            const r = await api("excluir_cliente", { body: { id } });
            if (r.ok) { closeAllSheets(); await recarregar(); rerender(); toast("Cliente excluído.", "info", { label: "Desfazer", fn: desfazerExclusao }); }
        });
    }
    async function desfazerExclusao() { if (!ultimoExcluido) return; const a = DB.getClientes(state.corretora); a.push(ultimoExcluido); DB.saveClientes(state.corretora, a); ultimoExcluido = null; await recarregar(); rerender(); toast("Exclusão desfeita.", "ok"); }
    function confirmarRestaurar(arq) {
        confirmar("Restaurar este backup?", "Seus clientes atuais serão substituídos por esta cópia. Um backup de segurança será criado antes.", "Restaurar", async () => { const r = await api("restaurar_backup", { body: { arquivo: arq } }); closeSheet(); if (r.ok) { await recarregar(); setView("dashboard"); toast("Backup restaurado.", "ok"); } else toast("Não consegui restaurar."); }, false);
    }
    function confirmarSair() { confirmar("Trocar de corretora?", "Você voltará para a tela inicial. Seus dados continuam salvos.", "Trocar", () => { closeAllSheets(); sair(); }, false); }

    /* ------------------------------- PWA -------------------------------- */
    function setupPWA() {
        try {
            const manifest = { name: "Bazinha Prime", short_name: "Bazinha", start_url: ".", display: "standalone", orientation: "portrait", background_color: "#2563EB", theme_color: "#2563EB", lang: "pt-BR", icons: [{ src: ICONS.i192, sizes: "192x192", type: "image/png", purpose: "any" }, { src: ICONS.i512, sizes: "512x512", type: "image/png", purpose: "any maskable" }] };
            const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
            const link = document.createElement("link"); link.rel = "manifest"; link.href = URL.createObjectURL(blob); document.head.appendChild(link);
            const apple = document.createElement("link"); apple.rel = "apple-touch-icon"; apple.href = ICONS.i192; document.head.appendChild(apple);
        } catch (e) {}
    }
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; renderInstallBanner(); if (state.view === "mais") rerender(); });
    function instalarPWA() { if (!deferredPrompt) { toast("Use o menu do navegador → 'Adicionar à tela inicial'."); return; } deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; renderInstallBanner(); if (state.view === "mais") rerender(); }); }
    function renderInstallBanner() {
        const el = $("#install-banner"); if (!el) return;
        let dismissed = false; try { dismissed = localStorage.getItem("bz_install_dismiss") === "1"; } catch (e) {}
        if (deferredPrompt && !dismissed && state.corretora) {
            el.innerHTML = `<div class="install-banner"><span style="font-size:20px">📲</span><span class="install-banner__txt">Instale na tela inicial e use como app</span><button class="install-banner__btn" data-act="instalar">Instalar</button><button class="install-banner__x" id="dismiss-install">✕</button></div>`;
            el.querySelector("#dismiss-install").onclick = () => { try { localStorage.setItem("bz_install_dismiss", "1"); } catch (e) {} el.innerHTML = ""; };
        } else el.innerHTML = "";
    }

    /* ------------------------------ Início ------------------------------ */
    $("#welcome-frase").textContent = FRASES[Math.floor(Math.random() * FRASES.length)];
    seedDefaultPins();
    setupPWA();
    loadWelcomeNames();
    try { const salva = parseInt(localStorage.getItem("bz_corretora")); if ([1, 2, 3, 4].includes(salva)) entrarComPin(salva); } catch (e) {}
})();
</script>
</body>
</html>
